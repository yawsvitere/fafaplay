[package]
name = "fafaplay"
version = "0.2.0"
edition = "2021"
description = "A dark iTunes-like desktop music player"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.29", features = ["persistence"] }
rfd = "0.15"
lofty = "0.22"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png"] }
resvg = "0.44"
# symphonia-декодеры дают нормальную перемотку (seek) для mp3/flac/wav
rodio = { version = "0.20.1", default-features = false, features = [
    "symphonia-mp3",
    "symphonia-flac",
    "symphonia-wav",
] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
winres = "0.1"

# в debug-сборке декодирование звука и картинок иначе будет тормозить
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"